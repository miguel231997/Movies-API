<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MigMovies</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://kit.fontawesome.com/b8894f06fa.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav__container">
            <div class="logo">MigMovies</div>
            <ul class="nav__links">
                <li><a href="index.html">Home</a></li>
                <li><a href="find.html">Find a Movie</a></li>
            </ul>
        </div>
    </nav>
    <main class="home">
        <section class="home__welcome">
            <h1>Welcome to our movie finder</h1>
            <h3>Find your next watch with MigMovies</h3>
            <div class="search__container">
                <input type="text" id="searchInput" placeholder="Search by Title, Year or Keyword" />
                <button onclick="handleSearch()">
                    <i class="fas fa-search"></i>
                    Search
                  </button>
            </div>
        </section>
        <div class="loader hidden">
            <i class="fas fa-spinner books__loading--spinner"></i>
        </div>
    </main>
    <script src="index.js" defer></script>
</body>
</html>
